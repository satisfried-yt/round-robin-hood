name: Publish Round Robin Hood 0.9.5

# Only a public repository can publish a release. The owner must explicitly
# change visibility in GitHub settings; this workflow cannot do it.
on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rrh-095-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Check public repository and required metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false || {
            echo "::error::Repository is still private."
            exit 1
          }
          test -n "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.description // ""')" || {
            echo "::error::Set the repository description."
            exit 1
          }
          topics="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.topics | length')"
          test "$topics" -gt 0 || {
            echo "::error::Add GitHub topics before publication."
            exit 1
          }
          test "$(cat VERSION)" = "0.9.5"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          if gh release view "v0.9.5" >/dev/null 2>&1; then
            echo "::error::Release v0.9.5 already exists. Refusing to replace."
            exit 1
          fi

      - name: Validate public HACS repository without ignored checks
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"

      - name: Validate integration with Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: python -m compileall -q custom_components/round_robin_hood tests scripts

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      # The release regression suite also checks that this script exists.
      - name: Check six-language offline handbook
        run: python tests/docs_093_check.py

      - name: Check frontend JavaScript syntax
        run: |
          node --check custom_components/round_robin_hood/frontend/panel.js
          for file in custom_components/round_robin_hood/frontend/guides/*/search-index.js; do
            node --check "$file"
          done

      - name: Verify strict six-language documentation build
        run: |
          python -m pip install 'mkdocs>=1.6,<2' 'mkdocs-material>=9.7,<10' 'mkdocs-static-i18n>=1.2,<2'
          python -m mkdocs build --strict

      - name: Create and verify complete 0.9.5 release archive
        run: |
          python scripts/build_release.py --output-dir dist
          python scripts/build_release.py --verify dist/round-robin-hood-0.9.5.zip
          (cd dist && sha256sum -c round-robin-hood-0.9.5.sha256)

      - name: Publish GitHub release v0.9.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          gh release create v0.9.5 \
            dist/round-robin-hood-0.9.5.zip \
            dist/round-robin-hood-0.9.5.sha256 \
            --target "$(git rev-parse HEAD)" \
            --title "Round Robin Hood 0.9.5" \
            --notes-file docs/RELEASE_NOTES_0.9.5.md \
            --latest
          gh release view v0.9.5 --json url,isDraft,isPrerelease,assets \
            --jq '{url,isDraft,isPrerelease,assets:[.assets[].name]}'
