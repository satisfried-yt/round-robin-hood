name: Release source verification

on:
  push:
    branches:
      - main
      - develop
      - "release-prep/**"
      - "hotfix/**"
    paths:
      - "VERSION"
      - "mkdocs.yml"
      - "custom_components/**"
      - "docs/**"
      - "tests/**"
      - "LICENSE"
      - "NOTICE"
      - "BRANDING.md"
      - "COPYRIGHT.md"
      - "README.md"
      - "CHANGELOG.md"
      - "hacs.json"
      - ".github/workflows/release-qa.yml"
      - "scripts/**"
      - ".github/workflows/publish-release.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "docs/**"
      - "tests/**"
      - "LICENSE"
      - "NOTICE"
      - "BRANDING.md"
      - "README.md"
      - "hacs.json"
      - ".github/workflows/release-qa.yml"
      - "scripts/**"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q custom_components/round_robin_hood tests scripts
      - name: Execute Python unit and release checks
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Verify the six offline handbook locales
        run: python tests/docs_093_check.py
      - name: Check frontend JavaScript syntax
        run: |
          node --check custom_components/round_robin_hood/frontend/panel.js
          for file in custom_components/round_robin_hood/frontend/guides/*/search-index.js; do
            node --check "$file"
          done
      - name: Build and verify release bundle (private preview)
        run: |
          python scripts/build_release.py --output-dir "$RUNNER_TEMP/rrh-preview"
          python scripts/build_release.py --verify "$RUNNER_TEMP/rrh-preview/round-robin-hood-0.9.5.zip"
          (cd "$RUNNER_TEMP/rrh-preview" && sha256sum -c round-robin-hood-0.9.5.sha256)

