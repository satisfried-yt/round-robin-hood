site_name: Round Robin Hood
site_description: Home Assistant PV surplus allocation by Satisfried
site_dir: site-build
docs_dir: docs/site
theme:
  name: material
  features:
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.suggest
  - search.highlight
plugins:
- search
